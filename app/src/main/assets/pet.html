<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: visible; width: 100px; height: 150px; display: flex; align-items: center; justify-content: center; font-family: sans-serif; position: relative; }

#pet { position: relative; width: 75px; height: 100px; transition: transform 0.3s ease; overflow: visible; }

#heatOverlay { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; transition: background 0.8s ease; }

#bubble { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); padding: 2px 7px; border-radius: 8px; font-size: 9px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; }
#bubble.show { opacity: 1; }
#bubble.default { background: #333; color: #eee; }
#bubble.angry { background: #4a1010; color: #ff6666; }
#bubble.soft { background: #3a3a50; color: #ddccff; }
#bubble.warm { background: #4a3020; color: #ffcc88; }
#bubble.cold { background: #1a2a3a; color: #88ccff; }

#zzz { position: absolute; top: 4px; right: 12px; font-size: 10px; color: #88aacc; opacity: 0; transition: opacity 0.4s; }
#zzz.show { opacity: 0.8; }

.bounce { animation: bounce 0.4s ease; }
.flinch { animation: flinch 0.3s ease; }
.wiggle { animation: wiggle 0.6s ease; }
.nod { animation: nod 0.6s ease; }
.sleep { animation: breathe 3s ease-in-out infinite; }
.wake { animation: stretch 0.8s ease-out; }
.tilt-right { transform: rotate(8deg); }
.tilt-left { transform: rotate(-8deg); }
.tilt-tiny-right { transform: rotate(4deg); }
.tilt-tiny-left { transform: rotate(-4deg); }
.sit { transform: translateY(5px); }
.carry { animation: carry 1.2s ease-in-out infinite; }
.drowsy { animation: drowsy 2s ease-in-out infinite; }
.peek { animation: peek 1.5s ease-in-out infinite; }
.bubble { animation: bubble 1.8s ease-in-out infinite; }

@keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } 60% { transform: translateY(-3px); } }
@keyframes flinch { 0% { transform: scale(1); } 30% { transform: scale(0.85, 1.15); } 60% { transform: scale(1.05, 0.95); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
@keyframes nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1, 0.96); } }

@keyframes float-up { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.5; } 100% { transform: translateY(-10px); opacity: 0; } }
@keyframes stretch { 0% { transform: scale(0.9, 1.1); } 30% { transform: scale(1.08, 0.92); } 60% { transform: scale(0.97, 1.03); } 100% { transform: scale(1, 1); } }
@keyframes carry { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
@keyframes drowsy { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(1px) rotate(-2deg); } 70% { transform: translateY(-1px) rotate(1deg); } }
@keyframes peek { 0%,100% { transform: translateY(0); } 15% { transform: translateY(-3px); } 30% { transform: translateY(0); } 45% { transform: translateY(-2px); } 60% { transform: translateY(0); } }
@keyframes bubble { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

.note-float { animation: float-up 1.6s ease-out forwards; }

.eye-glow { transition: all 0.3s ease; }
</style>
</head>
<body>
<div id="bubble" class="bubble"></div>
<div id="pet">
  <div id="heatOverlay"></div>
  <div id="zzz">Zzz</div>

  <svg viewBox="0 0 120 160" width="75" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9922"/>
        <stop offset="50%" stop-color="#cc5500"/>
        <stop offset="100%" stop-color="#882200"/>
      </radialGradient>
      <radialGradient id="skullGrad" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#f5f0e8"/>
        <stop offset="60%" stop-color="#e8e0d5"/>
        <stop offset="100%" stop-color="#d8d0c5"/>
      </radialGradient>
      <filter id="eyeFilter">
        <feGaussianBlur stdDeviation="0.6"/>
      </filter>
    </defs>

    <!-- Tail -->
    <path id="tail" d="M85 130 Q95 125 100 115 Q105 105 102 95 Q100 90 95 92 Q92 94 93 100 Q95 108 92 115 Q88 125 85 130" fill="#6a6a7a" stroke="#5a5a6a" stroke-width="0.5"/>

    <!-- Boots -->
    <path d="M40 148 Q38 150 38 154 L38 158 L48 158 L48 154 Q48 150 46 148 Z" fill="#4a4a5a" stroke="#5a5a6a" stroke-width="0.3"/>
    <path d="M42 148 L40 154 L46 154 L44 148" fill="#6a6a7a" stroke="none"/>
    <path d="M70 148 Q68 150 68 154 L68 158 L78 158 L78 154 Q78 150 76 148 Z" fill="#4a4a5a" stroke="#5a5a6a" stroke-width="0.3"/>
    <path d="M72 148 L70 154 L76 154 L74 148" fill="#6a6a7a" stroke="none"/>

    <!-- Legs -->
    <rect x="40" y="132" width="10" height="18" rx="3" fill="#5a5a6a"/>
    <rect x="66" y="132" width="10" height="18" rx="3" fill="#5a5a6a"/>

    <!-- Body -->
    <path id="body" d="M38 88 Q36 104 34 116 Q32 128 34 138 Q36 142 40 144 L76 144 Q80 142 82 138 Q84 128 82 116 Q80 104 78 88 Z" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>

    <!-- Arms -->
    <path id="armL" d="M38 90 Q28 92 24 100 Q22 108 24 116 Q24 120 28 122 L32 122 Q36 122 38 118" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <path d="M24 100 Q22 102 24 104" fill="none" stroke="#7a7a8a" stroke-width="0.4"/>
    
    <path id="armR" d="M78 90 Q88 92 92 100 Q94 108 92 116 Q92 120 88 122 L84 122 Q80 122 78 118" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <path d="M92 100 Q94 102 92 104" fill="none" stroke="#7a7a8a" stroke-width="0.4"/>

    <!-- Hands -->
    <path id="handL" d="M24 116 Q18 118 16 122 Q14 126 18 128 Q20 128 22 126 L24 128 Q26 130 28 128 Q30 130 32 126 Q34 124 32 122 Q30 120 28 118 Z" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <rect x="18" y="124" width="12" height="2" rx="1" fill="#5a5a6a"/>
    
    <path id="handR" d="M92 116 Q98 118 100 122 Q102 126 98 128 Q96 128 94 126 L92 128 Q90 130 88 128 Q86 130 84 126 Q82 124 84 122 Q86 120 88 118 Z" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <rect x="86" y="124" width="12" height="2" rx="1" fill="#5a5a6a"/>

    <!-- Hood (cat ear hoodie) -->
    <path id="hood" d="M32 58 Q28 32 34 22 Q38 16 48 14 Q52 8 56 6 Q60 4 64 6 Q68 8 72 14 Q82 16 86 22 Q92 32 88 58 Q90 74 88 78 Q86 82 82 82 L38 82 Q34 82 32 78 Q30 74 32 58 Z" fill="#7a7a8a" stroke="#8a8a9a" stroke-width="0.4"/>
    
    <!-- Cat ears -->
    <path d="M48 14 Q44 4 48 2 Q52 4 56 6 Q52 8 48 14" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <path d="M72 14 Q76 4 72 2 Q68 4 64 6 Q68 8 72 14" fill="#6a6a7a" stroke="#7a7a8a" stroke-width="0.3"/>
    <!-- Inner ear -->
    <path d="M50 12 Q48 6 50 4 Q52 6 54 8" fill="#8a8a9a" stroke="none"/>
    <path d="M70 12 Q72 6 70 4 Q68 6 66 8" fill="#8a8a9a" stroke="none"/>

    <!-- Hood folds -->
    <path d="M36 42 Q34 44 34 48" fill="none" stroke="#8a8a9a" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M84 42 Q86 44 86 48" fill="none" stroke="#8a8a9a" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M34 56 Q36 58 34 62" fill="none" stroke="#8a8a9a" stroke-width="0.3" stroke-linecap="round"/>
    <path d="M86 56 Q84 58 86 62" fill="none" stroke="#8a8a9a" stroke-width="0.3" stroke-linecap="round"/>

    <!-- Skull mask -->
    <path id="skull" d="M42 48 Q40 38 44 32 Q48 26 54 24 Q60 23 66 24 Q72 26 76 32 Q80 38 78 48 L78 56 Q80 64 76 68 Q74 72 70 76 Q66 78 60 78 Q58 78 56 76 Q52 72 50 68 Q46 64 48 60 Q44 56 44 52 Z" fill="url(#skullGrad)" stroke="#c8c0b8" stroke-width="0.5"/>
    
    <!-- Skull shading -->
    <path d="M46 38 Q52 36 60 36" fill="none" stroke="#e0d8d0" stroke-width="0.3"/>
    <path d="M60 36 Q66 36 72 38" fill="none" stroke="#e0d8d0" stroke-width="0.3"/>

    <!-- Eye sockets -->
    <path id="eyeL" d="M44 50 Q46 44 51 42 Q54 42 56 46 Q58 50 56 54 Q54 58 51 58 Q46 58 44 54 Z" fill="#1a1a1a"/>
    <path id="eyeR" d="M60 46 Q62 42 65 42 Q68 44 70 50 Q72 54 70 58 Q67 58 64 54 Q62 50 62 46 Z" fill="#1a1a1a"/>

    <!-- Glowing pupils -->
    <ellipse class="eye-glow eye-pupil" id="eyeLeft" cx="51" cy="50" rx="3.5" ry="4" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>
    <ellipse class="eye-glow eye-pupil" id="eyeRight" cx="65" cy="50" rx="3.5" ry="4" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>

    <!-- Eye sparkle -->
    <ellipse id="sparkL" cx="48.5" cy="48" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>
    <ellipse id="sparkR" cx="62.5" cy="48" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>

    <!-- Brow ridge -->
    <path d="M44 48 Q48 44 54 42" fill="none" stroke="#d8d0c8" stroke-width="0.3" stroke-linecap="round"/>
    <path d="M62 42 Q68 44 72 48" fill="none" stroke="#d8d0c8" stroke-width="0.3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M56 62 Q56 58 60 57 Q64 58 64 62 Q64 66 60 68 Q56 66 56 62 Z" fill="#2a2a28"/>

    <!-- Jaw -->
    <path d="M44 62 Q46 66 50 68" fill="none" stroke="#c8c0b8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M52 68 Q56 70 60 72" fill="none" stroke="#c8c0b8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M64 72 Q68 70 70 68" fill="none" stroke="#c8c0b8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M72 68 Q76 66 78 62" fill="none" stroke="#c8c0b8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M60 70 L60 78" fill="none" stroke="#c8c0b8" stroke-width="0.5" stroke-linecap="round"/>

    <!-- Teeth -->
    <line x1="48" y1="66" x2="48" y2="70" stroke="#ddd0c0" stroke-width="0.4"/>
    <line x1="52" y1="68" x2="52" y2="72" stroke="#ddd0c0" stroke-width="0.4"/>
    <line x1="56" y1="70" x2="56" y2="74" stroke="#ddd0c0" stroke-width="0.4"/>
    <line x1="64" y1="70" x2="64" y2="74" stroke="#ddd0c0" stroke-width="0.4"/>
    <line x1="68" y1="68" x2="68" y2="72" stroke="#ddd0c0" stroke-width="0.4"/>
    <line x1="72" y1="66" x2="72" y2="70" stroke="#ddd0c0" stroke-width="0.4"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const sparkL = document.getElementById('sparkL');
const sparkR = document.getElementById('sparkR');

let currentState = 'idle';
let currentOutfit = 'default';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowFill, glowRx, glowRy, glowOpacity) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowFill || 'url(#eyeGlow)');
    e.setAttribute('rx', glowRx != null ? glowRx : 3.5);
    e.setAttribute('ry', glowRy != null ? glowRy : 4);
    e.setAttribute('opacity', glowOpacity != null ? glowOpacity : '1');
  });
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}

var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  var duration = name === 'sleep' ? 3000 : (name === 'wiggle' || name === 'nod' ? 600 : 400);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, duration);
}

function setExpression(expr) {
  var animClasses = ['sleep', 'wake', 'carry', 'drowsy', 'peek', 'bubble', 'tilt-right', 'tilt-left', 'tilt-tiny-right', 'tilt-tiny-left', 'sit'];
  animClasses.forEach(function(c) { pet.classList.remove(c); });
  zzz.classList.remove('show');

  switch (expr) {
    case 'happy':
      setEyes('#ffbb00', 3, 4.5, 1);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 2.5, 3, 1);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 3, 4.5, 1);
      playAnimation('flinch');
      break;
    case 'sleep':
      setEyes('#332200', 1.5, 1.5, 0.3);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'wake':
      setEyes('#cc6600', 3.5, 3.5, 0.7);
      pet.classList.add('wake');
      setTimeout(function() { pet.classList.remove('wake'); }, 800);
      break;
    case 'peek':
      setEyes('#cc6600', 4, 4, 0.7);
      pet.classList.add('peek');
      break;
    case 'bubble':
      setEyes('#6688aa', 3, 3, 0.5);
      pet.classList.add('bubble');
      break;
    case 'carry':
      setEyes('#cc6600', 3, 3.5, 0.7);
      pet.classList.add('carry');
      break;
    case 'drowsy':
      setEyes('#553300', 1.5, 1.5, 0.4);
      pet.classList.add('drowsy');
      break;
    case 'shocked':
      setEyes('#ffcc00', 5.5, 5.5, 1);
      playAnimation('flinch');
      break;
    case 'sad':
      setEyes('#446688', 2.5, 3, 0.5);
      pet.classList.add('tilt-tiny-left');
      setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 1500);
      break;
    case 'alert':
      setEyes('#ff4400', 5, 5, 1);
      break;
    case 'soft':
      setEyes('#cc6600', 3.5, 3.5, 0.6);
      break;
    case 'curious':
      setEyes('#ffaa00', 4.5, 4.5, 1);
      pet.classList.add('tilt-tiny-right');
      setTimeout(function() { pet.classList.remove('tilt-tiny-right'); }, 1500);
      break;
    case 'smug':
      setEyes('#ff8800', 2, 3.5, 1);
      pet.classList.add('tilt-tiny-left');
      setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 1500);
      break;
    case 'deadpan':
      setEyes('#cc5500', 3, 2, 0.8);
      break;
    case 'surprised':
      setEyes('#ffcc00', 5.5, 5.5, 1);
      playAnimation('flinch');
      break;
    case 'normal':
    case 'idle':
    default:
      setEyes('url(#eyeGlow)', 3.5, 4, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
  idleMinutes = 0;
}

var idleTimer = null;
function scheduleIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  var delay = 8000 + Math.random() * 15000;
  idleTimer = setTimeout(doIdleAction, delay);
}
function doIdleAction() {
  if (currentState === 'sleep') { scheduleIdle(); return; }
  var r = Math.random();
  if (r < 0.18) {
    playAnimation('tilt-tiny-left');
    setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 800);
  } else if (r < 0.32) {
    playAnimation('tilt-tiny-right');
    setTimeout(function() { pet.classList.remove('tilt-tiny-right'); }, 800);
  } else if (r < 0.44) {
    playAnimation('wiggle');
  } else if (r < 0.52) {
    playAnimation('nod');
  } else {
    var talks = ['喵', '哼', '哦', '在', '嗯', '怎么了', '找我', '有事', '发呆中', '无聊', '困', '饿', '想你了', '在干嘛', '哈喽', 'Hi', '在呢', '听着', '待命', '站岗'];
    var pick = talks[Math.floor(Math.random() * talks.length)];
    showBubble(pick, 'soft', 3500);
  }
  scheduleIdle();
}

var blinkTimer = null;
function scheduleBlink() {
  if (blinkTimer) clearTimeout(blinkTimer);
  var delay = 2000 + Math.random() * 4000;
  blinkTimer = setTimeout(doBlink, delay);
}
function doBlink() {
  if (currentState === 'sleep') { scheduleBlink(); return; }
  [eyeLeft, eyeRight, sparkL, sparkR].forEach(function(e) { e.setAttribute('opacity', '0.1'); });
  setTimeout(function() {
    [eyeLeft, eyeRight, sparkL, sparkR].forEach(function(e) { e.setAttribute('opacity', '1'); });
    sparkL.setAttribute('opacity', '0.85');
    sparkR.setAttribute('opacity', '0.85');
  }, 120);
  scheduleBlink();
}

window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  getState: function() { return currentState; }
};

setExpression('idle');
scheduleIdle();
scheduleBlink();
</script>
</body>
</html>
