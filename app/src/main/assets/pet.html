<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pet {
    width: 120px;
    height: 160px;
    transition: transform 0.3s ease;
  }
  .pet.tilt-left  { transform: rotate(-5deg); }
  .pet.tilt-right { transform: rotate(5deg); }
  .pet.bounce     { animation: bounce 0.4s ease; }
  .pet.flinch     { animation: flinch 0.3s ease; }
  .pet.sleep      { animation: breathe 3s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-3px); }
  }
  @keyframes flinch {
    0% { transform: scale(1); }
    30% { transform: scale(0.9); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.94); }
  }
  .bubble {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 180px;
    padding: 7px 12px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.4;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: center;
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
  .bubble.default { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
  .bubble.angry   { background: #3a1a1a; color: #f88; border: 1px solid #622; }
  .bubble.soft    { background: #1a1a2a; color: #aac; border: 1px solid #335; }
  .bubble.warm    { background: #2a1a1a; color: #faa; border: 1px solid #533; }
  .heat-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: transparent;
    transition: background 0.8s ease;
  }
  .zzz {
    position: absolute;
    top: 0;
    right: 5px;
    font-size: 14px;
    color: #8899cc;
    opacity: 0;
    transition: opacity 0.5s ease;
    font-family: sans-serif;
  }
  .zzz.show { opacity: 1; }
  .eye-glow { transition: all 0.3s ease; }
</style>
</head>
<body>
<div class="heat-overlay" id="heatOverlay"></div>
<div class="container">
  <div class="bubble default" id="bubble"></div>
  <div class="zzz" id="zzz">Zzz</div>
  <svg class="pet" id="pet" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skullGrad" cx="50%" cy="35%" r="55%">
        <stop offset="0%" stop-color="#faf5ee"/>
        <stop offset="100%" stop-color="#d8cfc4"/>
      </radialGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdd44"/>
        <stop offset="35%" stop-color="#ff8800"/>
        <stop offset="100%" stop-color="#cc4400"/>
      </radialGradient>
      <filter id="eyeFilter" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="1" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softShadow" x="-30%" y="-10%" width="160%" height="140%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
      </filter>
    </defs>

    <!-- Shadow on ground -->
    <ellipse cx="60" cy="152" rx="30" ry="5" fill="rgba(0,0,0,0.18)"/>

    <!-- Legs: tiny stubby legs -->
    <rect x="44" y="120" width="12" height="18" rx="5" fill="#1a1a22"/>
    <rect x="64" y="120" width="12" height="18" rx="5" fill="#1a1a22"/>
    <!-- Boots -->
    <rect x="42" y="134" width="16" height="8" rx="3" fill="#2a2a34"/>
    <rect x="62" y="134" width="16" height="8" rx="3" fill="#2a2a34"/>

    <!-- Body: chibi torso, tactical vest -->
    <g filter="url(#softShadow)">
      <!-- Torso -->
      <rect x="38" y="82" width="44" height="42" rx="8" fill="#2a2a34"/>
      <!-- Tactical vest: darker panel -->
      <rect x="36" y="84" width="48" height="38" rx="7" fill="#1e1e28"/>
      <!-- Vest pocket left -->
      <rect x="40" y="88" width="14" height="12" rx="2" fill="#252530" stroke="#333" stroke-width="0.5"/>
      <!-- Vest pocket right -->
      <rect x="66" y="88" width="14" height="12" rx="2" fill="#252530" stroke="#333" stroke-width="0.5"/>
      <!-- Vest center strap -->
      <line x1="56" y1="84" x2="56" y2="100" stroke="#333" stroke-width="0.6"/>
      <!-- Vest pouch row -->
      <rect x="40" y="104" width="8" height="6" rx="1" fill="#2a2a36" stroke="#333" stroke-width="0.3"/>
      <rect x="50" y="104" width="8" height="6" rx="1" fill="#2a2a36" stroke="#333" stroke-width="0.3"/>
      <rect x="60" y="104" width="8" height="6" rx="1" fill="#2a2a36" stroke="#333" stroke-width="0.3"/>
      <rect x="70" y="104" width="8" height="6" rx="1" fill="#2a2a36" stroke="#333" stroke-width="0.3"/>
    </g>

    <!-- Arms: tiny at sides -->
    <ellipse cx="34" cy="90" rx="6" ry="14" fill="#2a2a34" transform="rotate(10 34 90)"/>
    <ellipse cx="86" cy="90" rx="6" ry="14" fill="#2a2a34" transform="rotate(-10 86 90)"/>

    <!-- Head: big chibi head, balaclava + skull mask -->
    <g>
      <!-- Balaclava: dark fabric covering head -->
      <ellipse cx="60" cy="58" rx="28" ry="26" fill="#2a2a34"/>
      <!-- Balaclava texture/fold lines -->
      <path d="M38 50 Q40 46 44 44" fill="none" stroke="#353540" stroke-width="0.6"/>
      <path d="M82 50 Q80 46 76 44" fill="none" stroke="#353540" stroke-width="0.6"/>

      <!-- Skull mask on face: white bone plate -->
      <ellipse cx="60" cy="60" rx="20" ry="18" fill="url(#skullGrad)" stroke="#c4b8a8" stroke-width="0.6"/>

      <!-- Skull cheekbone curves -->
      <path d="M42 64 Q40 60 42 54" fill="none" stroke="#ccc0b0" stroke-width="1" stroke-linecap="round"/>
      <path d="M78 64 Q80 60 78 54" fill="none" stroke="#ccc0b0" stroke-width="1" stroke-linecap="round"/>

      <!-- Eye sockets: dark pits, slightly angled for cool look -->
      <ellipse id="eyeL" cx="53" cy="58" rx="7" ry="8" fill="#0a0a0a" transform="rotate(-3 53 58)"/>
      <ellipse id="eyeR" cx="67" cy="58" rx="7" ry="8" fill="#0a0a0a" transform="rotate(3 67 58)"/>

      <!-- Glowing amber eyes: the signature feature -->
      <ellipse class="eye-glow" id="eyeLeft" cx="53" cy="58" rx="3.5" ry="4"
        fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>
      <ellipse class="eye-glow" id="eyeRight" cx="67" cy="58" rx="3.5" ry="4"
        fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>

      <!-- Eye highlights -->
      <ellipse cx="50.5" cy="56" rx="1.5" ry="1.5" fill="#fff" opacity="0.85"/>
      <ellipse cx="64.5" cy="56" rx="1.5" ry="1.5" fill="#fff" opacity="0.85"/>

      <!-- Nose cavity: tiny -->
      <ellipse cx="60" cy="68" rx="2.5" ry="1.8" fill="#1a1a18"/>

      <!-- Jaw crack line -->
      <path d="M44 74 Q52 78 60 76 Q68 78 76 74" fill="none" stroke="#c4b8a8" stroke-width="0.7" stroke-linecap="round"/>
      <line x1="60" y1="76" x2="60" y2="81" stroke="#c4b8a8" stroke-width="0.5" stroke-linecap="round"/>

      <!-- Teeth lines -->
      <line x1="50" y1="74" x2="50" y2="78" stroke="#ccc0b0" stroke-width="0.4"/>
      <line x1="56" y1="75" x2="56" y2="79" stroke="#ccc0b0" stroke-width="0.4"/>
      <line x1="64" y1="75" x2="64" y2="79" stroke="#ccc0b0" stroke-width="0.4"/>
      <line x1="70" y1="74" x2="70" y2="78" stroke="#ccc0b0" stroke-width="0.4"/>
    </g>

    <!-- Beret/beanie on top -->
    <ellipse cx="60" cy="38" rx="24" ry="6" fill="#1e1e28"/>
    <path d="M36 38 Q36 24 60 22 Q84 24 84 38" fill="#1e1e28" stroke="#2a2a36" stroke-width="0.3"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');

let currentState = 'idle';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowFill, glowRx, glowRy, glowOpacity) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowFill || 'url(#eyeGlow)');
    e.setAttribute('rx', glowRx || 3.5);
    e.setAttribute('ry', glowRy || 4);
    e.setAttribute('opacity', glowOpacity != null ? glowOpacity : '1');
  });
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}
function decayHeat() {
  if (heat > 0) { setHeat(heat - 1); setTimeout(decayHeat, 30000); }
}
var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, name === 'sleep' ? 3000 : 400);
}

function setExpression(expr) {
  switch (expr) {
    case 'happy':
      setEyes('#ffcc00', 3, 4.5, 1);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 2.5, 3, 1);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 3, 4.5, 1);
      playAnimation('flinch');
      break;
    case 'sleepy':
      setEyes('#664400', 1.5, 1.5, 0.4);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'alert':
      setEyes('#ff4400', 5, 5, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
      break;
    case 'soft':
      setEyes('#ffaa66', 3.5, 3.5, 0.7);
      break;
    default:
      setEyes('url(#eyeGlow)', 3.5, 4, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
}

window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  getState: function() { return currentState; }
};

setInterval(function() {
  idleMinutes++;
  if (idleMinutes >= 30) setExpression('sleepy');
}, 60000);

setExpression('idle');
decayHeat();
</script>
</body>
</html>
