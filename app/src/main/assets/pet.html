<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pet {
    width: 160px;
    height: 200px;
    transition: transform 0.3s ease;
  }
  .pet.tilt-left  { transform: rotate(-5deg); }
  .pet.tilt-right { transform: rotate(5deg); }
  .pet.bounce     { animation: bounce 0.4s ease; }
  .pet.flinch     { animation: flinch 0.3s ease; }
  .pet.sleep      { animation: breathe 3s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-12px); }
    60% { transform: translateY(-4px); }
  }
  @keyframes flinch {
    0% { transform: scale(1); }
    30% { transform: scale(0.9); }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.96); }
  }
  .bubble {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 200px;
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: center;
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
  .bubble.default { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
  .bubble.angry   { background: #3a1a1a; color: #f88; border: 1px solid #622; }
  .bubble.soft    { background: #1a1a2a; color: #aac; border: 1px solid #335; }
  .bubble.warm    { background: #2a1a1a; color: #faa; border: 1px solid #533; }
  .heat-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: transparent;
    transition: background 0.8s ease;
  }
  .zzz {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 16px;
    color: #888;
    opacity: 0;
    transition: opacity 0.5s ease;
    font-family: sans-serif;
  }
  .zzz.show { opacity: 1; }
  .eye-glow { transition: all 0.4s ease; }
  .blush { opacity: 0; transition: opacity 0.4s ease; }
</style>
</head>
<body>
<div class="heat-overlay" id="heatOverlay"></div>
<div class="container">
  <div class="bubble default" id="bubble"></div>
  <div class="zzz" id="zzz">Zzz</div>
  <svg class="pet" id="pet" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGrad" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#4a4a52"/>
        <stop offset="100%" stop-color="#1a1a20"/>
      </radialGradient>
      <radialGradient id="skullGrad" cx="50%" cy="25%" r="55%">
        <stop offset="0%" stop-color="#f5f0e8"/>
        <stop offset="100%" stop-color="#d4c8b8"/>
      </radialGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffcc44"/>
        <stop offset="40%" stop-color="#ff8800"/>
        <stop offset="100%" stop-color="#cc4400"/>
      </radialGradient>
      <radialGradient id="cheekFlush" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9988" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#ff9988" stop-opacity="0"/>
      </radialGradient>
      <filter id="softShadow" x="-20%" y="-10%" width="140%" height="130%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
      </filter>
      <filter id="eyeFilter" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Shadow on ground -->
    <ellipse cx="80" cy="188" rx="38" ry="6" fill="rgba(0,0,0,0.25)"/>

    <!-- Body: cute round ghost blob with wavy bottom -->
    <g filter="url(#softShadow)">
      <path id="bodyPath" d="M38 75 Q36 38 80 32 Q124 38 122 75 L124 155 Q122 170 109 166 Q100 156 90 166 Q80 174 70 166 Q60 156 51 166 Q38 170 38 155 Z" fill="url(#bodyGrad)"/>
    </g>

    <!-- Tiny cute hands -->
    <ellipse cx="40" cy="108" rx="10" ry="7" fill="#2a2a32" transform="rotate(-20 40 108)"/>
    <ellipse cx="120" cy="108" rx="10" ry="7" fill="#2a2a32" transform="rotate(20 120 108)"/>

    <!-- Hood/beanie top -->
    <path d="M44 42 Q42 28 80 26 Q118 28 116 42 Q118 34 80 30 Q42 34 44 42Z" fill="#222228"/>

    <!-- Skull mask on face -->
    <g id="skullMask">
      <!-- Mask base: rounded skull shape -->
      <rect x="50" y="44" width="60" height="54" rx="16" ry="15" fill="url(#skullGrad)" stroke="#b8a898" stroke-width="0.8"/>

      <!-- Cheekbone contours -->
      <path d="M50 64 Q46 62 46 58 Q46 52 50 48" fill="none" stroke="#c8b8a4" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M110 64 Q114 62 114 58 Q114 52 110 48" fill="none" stroke="#c8b8a4" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Eye sockets: dark pits -->
      <ellipse id="eyeL" cx="64" cy="63" rx="10" ry="11" fill="#1a1a18"/>
      <ellipse id="eyeR" cx="96" cy="63" rx="10" ry="11" fill="#1a1a18"/>

      <!-- Glowing amber pupils -->
      <ellipse class="eye-glow" id="eyeLeft" cx="64" cy="63" rx="5" ry="5.5" fill="url(#eyeGlow)" filter="url(#eyeFilter)"/>
      <ellipse class="eye-glow" id="eyeRight" cx="96" cy="63" rx="5" ry="5.5" fill="url(#eyeGlow)" filter="url(#eyeFilter)"/>

      <!-- Eye highlights: tiny white dots -->
      <ellipse cx="61.5" cy="61" rx="1.8" ry="1.8" fill="#fff" opacity="0.7"/>
      <ellipse cx="93.5" cy="61" rx="1.8" ry="1.8" fill="#fff" opacity="0.7"/>

      <!-- Nose hole -->
      <ellipse cx="80" cy="79" rx="3.5" ry="2.5" fill="#1a1a18"/>

      <!-- Jaw crack line -->
      <path d="M54 86 Q62 92 80 90 Q98 92 106 86" fill="none" stroke="#b8a898" stroke-width="1" stroke-linecap="round"/>
      <line x1="80" y1="90" x2="80" y2="98" stroke="#b8a898" stroke-width="0.8" stroke-linecap="round"/>

      <!-- Teeth lines -->
      <line x1="66" y1="86" x2="66" y2="92" stroke="#c8b8a4" stroke-width="0.6"/>
      <line x1="74" y1="88" x2="74" y2="94" stroke="#c8b8a4" stroke-width="0.6"/>
      <line x1="86" y1="88" x2="86" y2="94" stroke="#c8b8a4" stroke-width="0.6"/>
      <line x1="94" y1="86" x2="94" y2="92" stroke="#c8b8a4" stroke-width="0.6"/>
    </g>

    <!-- Cheek blush: hidden by default -->
    <ellipse class="blush" id="blushLeft" cx="54" cy="78" rx="8" ry="5" fill="url(#cheekFlush)" opacity="0"/>
    <ellipse class="blush" id="blushRight" cx="106" cy="78" rx="8" ry="5" fill="url(#cheekFlush)" opacity="0"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const blushLeft = document.getElementById('blushLeft');
const blushRight = document.getElementById('blushRight');

let currentState = 'idle';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowColor, glowRx, glowRy) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowColor || '#ff6600');
    e.setAttribute('rx', glowRx || 5);
    e.setAttribute('ry', glowRy || 4);
  });
}
function setBlush(show) {
  var op = show ? 0.6 : 0;
  blushLeft.setAttribute('opacity', op);
  blushRight.setAttribute('opacity', op);
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}
function decayHeat() {
  if (heat > 0) { setHeat(heat - 1); setTimeout(decayHeat, 30000); }
}
var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, name === 'sleep' ? 3000 : 400);
}
function setExpression(expr) {
  switch (expr) {
    case 'happy':
      setEyes('#ffcc00', 5, 6); setBlush(true);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 4, 5); setBlush(false);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 4, 6); setBlush(true);
      playAnimation('flinch');
      break;
    case 'sleepy':
      setEyes('#664400', 2, 2); setBlush(false);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'alert':
      setEyes('#ff4400', 7, 6); setBlush(false);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
      break;
    case 'soft':
      setEyes('#ffaa66', 5, 4); setBlush(true);
      break;
    default:
      setEyes('#ff6600', 5, 5.5); setBlush(false);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
}
window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  getState: function() { return currentState; }
};
setInterval(function() {
  idleMinutes++;
  if (idleMinutes >= 30) setExpression('sleepy');
}, 60000);
setExpression('idle');
decayHeat();
</script>
</body>
</html>
