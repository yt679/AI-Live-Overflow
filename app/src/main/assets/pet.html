<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pet {
    width: 120px;
    height: 150px;
    transition: transform 0.3s ease;
  }
  .pet.tilt-left  { transform: rotate(-5deg); }
  .pet.tilt-right { transform: rotate(5deg); }
  .pet.bounce     { animation: bounce 0.4s ease; }
  .pet.flinch     { animation: flinch 0.3s ease; }
  .pet.sleep      { animation: breathe 3s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-3px); }
  }
  @keyframes flinch {
    0% { transform: scale(1); }
    30% { transform: scale(0.9); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.94); }
  }
  .bubble {
    position: absolute;
    top: -48px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 180px;
    padding: 7px 12px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.4;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: center;
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
  .bubble.default { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
  .bubble.angry   { background: #3a1a1a; color: #f88; border: 1px solid #622; }
  .bubble.soft    { background: #1a1a2a; color: #aac; border: 1px solid #335; }
  .bubble.warm    { background: #2a1a1a; color: #faa; border: 1px solid #533; }
  .heat-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: transparent;
    transition: background 0.8s ease;
  }
  .zzz {
    position: absolute;
    top: 0;
    right: 10px;
    font-size: 13px;
    color: #8899cc;
    opacity: 0;
    transition: opacity 0.5s ease;
    font-family: sans-serif;
  }
  .zzz.show { opacity: 1; }
  .eye-glow { transition: all 0.3s ease; }
</style>
</head>
<body>
<div class="heat-overlay" id="heatOverlay"></div>
<div class="container">
  <div class="bubble default" id="bubble"></div>
  <div class="zzz" id="zzz">Zzz</div>
  <svg class="pet" id="pet" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skullGrad" cx="50%" cy="35%" r="55%">
        <stop offset="0%" stop-color="#faf5ee"/>
        <stop offset="100%" stop-color="#d8cfc4"/>
      </radialGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdd44"/>
        <stop offset="35%" stop-color="#ff8800"/>
        <stop offset="100%" stop-color="#cc4400"/>
      </radialGradient>
      <filter id="eyeFilter" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="1" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softShadow" x="-30%" y="-10%" width="160%" height="140%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
      </filter>
    </defs>

    <!-- Ground shadow -->
    <ellipse cx="60" cy="145" rx="24" ry="4" fill="rgba(0,0,0,0.18)"/>

    <!-- Feet: tiny boots -->
    <rect x="48" y="120" width="10" height="10" rx="3" fill="#1a1a22"/>
    <rect x="62" y="120" width="10" height="10" rx="3" fill="#1a1a22"/>
    <rect x="46" y="128" width="14" height="6" rx="2" fill="#2a2a36"/>
    <rect x="60" y="128" width="14" height="6" rx="2" fill="#2a2a36"/>

    <!-- Body: chibi torso with tactical vest -->
    <g filter="url(#softShadow)">
      <rect x="40" y="84" width="40" height="38" rx="7" fill="#282830"/>
      <!-- Tactical vest panel -->
      <rect x="38" y="86" width="44" height="34" rx="6" fill="#1c1c24"/>
      <!-- Vest pockets -->
      <rect x="42" y="90" width="12" height="10" rx="2" fill="#22222c" stroke="#333" stroke-width="0.4"/>
      <rect x="66" y="90" width="12" height="10" rx="2" fill="#22222c" stroke="#333" stroke-width="0.4"/>
      <!-- Vest pouches row -->
      <rect x="42" y="104" width="7" height="5" rx="1" fill="#282834" stroke="#333" stroke-width="0.3"/>
      <rect x="51" y="104" width="7" height="5" rx="1" fill="#282834" stroke="#333" stroke-width="0.3"/>
      <rect x="60" y="104" width="7" height="5" rx="1" fill="#282834" stroke="#333" stroke-width="0.3"/>
      <rect x="69" y="104" width="7" height="5" rx="1" fill="#282834" stroke="#333" stroke-width="0.3"/>
    </g>

    <!-- Arms with proper hand shapes, not ellipses -->
    <!-- Left arm -->
    <rect x="32" y="88" width="8" height="20" rx="4" fill="#282830"/>
    <!-- Left hand: small rounded rectangle with finger lines -->
    <rect x="30" y="106" width="10" height="8" rx="3" fill="#282830"/>
    <line x1="33" y1="106" x2="33" y2="112" stroke="#333" stroke-width="0.4"/>
    <line x1="35" y1="106" x2="35" y2="112" stroke="#333" stroke-width="0.4"/>
    <line x1="37" y1="106" x2="37" y2="112" stroke="#333" stroke-width="0.4"/>

    <!-- Right arm -->
    <rect x="80" y="88" width="8" height="20" rx="4" fill="#282830"/>
    <!-- Right hand -->
    <rect x="80" y="106" width="10" height="8" rx="3" fill="#282830"/>
    <line x1="83" y1="106" x2="83" y2="112" stroke="#333" stroke-width="0.4"/>
    <line x1="85" y1="106" x2="85" y2="112" stroke="#333" stroke-width="0.4"/>
    <line x1="87" y1="106" x2="87" y2="112" stroke="#333" stroke-width="0.4"/>

    <!-- Head: big chibi head -->
    <!-- Balaclava base -->
    <ellipse cx="60" cy="56" rx="26" ry="24" fill="#282830"/>

    <!-- Skull mask plate -->
    <ellipse cx="60" cy="58" rx="19" ry="17" fill="url(#skullGrad)" stroke="#c4b8a8" stroke-width="0.5"/>

    <!-- Cheekbone lines -->
    <path d="M43 62 Q41 58 43 52" fill="none" stroke="#ccc0b0" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M77 62 Q79 58 77 52" fill="none" stroke="#ccc0b0" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Eye sockets -->
    <ellipse id="eyeL" cx="53" cy="56" rx="7" ry="7.5" fill="#0a0a0a"/>
    <ellipse id="eyeR" cx="67" cy="56" rx="7" ry="7.5" fill="#0a0a0a"/>

    <!-- Glowing amber pupils -->
    <ellipse class="eye-glow" id="eyeLeft" cx="53" cy="56" rx="3.5" ry="4"
      fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>
    <ellipse class="eye-glow" id="eyeRight" cx="67" cy="56" rx="3.5" ry="4"
      fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>

    <!-- Eye sparkle -->
    <ellipse cx="50.5" cy="54" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>
    <ellipse cx="64.5" cy="54" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>

    <!-- Nose cavity -->
    <ellipse cx="60" cy="66" rx="2.5" ry="1.8" fill="#1a1a18"/>

    <!-- Jaw crack -->
    <path d="M45 72 Q52 76 60 74 Q68 76 75 72" fill="none" stroke="#c4b8a8" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="60" y1="74" x2="60" y2="79" stroke="#c4b8a8" stroke-width="0.5" stroke-linecap="round"/>

    <!-- Teeth -->
    <line x1="50" y1="72" x2="50" y2="76" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="56" y1="73" x2="56" y2="77" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="64" y1="73" x2="64" y2="77" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="70" y1="72" x2="70" y2="76" stroke="#ccc0b0" stroke-width="0.4"/>

    <!-- Headphones around neck -->
    <path d="M34 78 Q32 84 38 84" fill="none" stroke="#1a1a24" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 78 Q88 84 82 84" fill="none" stroke="#1a1a24" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 82 Q60 90 82 82" fill="none" stroke="#1a1a24" stroke-width="2" stroke-linecap="round"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');

let currentState = 'idle';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowFill, glowRx, glowRy, glowOpacity) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowFill || 'url(#eyeGlow)');
    e.setAttribute('rx', glowRx || 3.5);
    e.setAttribute('ry', glowRy || 4);
    e.setAttribute('opacity', glowOpacity != null ? glowOpacity : '1');
  });
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}
function decayHeat() {
  if (heat > 0) { setHeat(heat - 1); setTimeout(decayHeat, 30000); }
}
var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, name === 'sleep' ? 3000 : 400);
}

function setExpression(expr) {
  switch (expr) {
    case 'happy':
      setEyes('#ffcc00', 3, 4.5, 1);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 2.5, 3, 1);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 3, 4.5, 1);
      playAnimation('flinch');
      break;
    case 'sleepy':
      setEyes('#664400', 1.5, 1.5, 0.4);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'alert':
      setEyes('#ff4400', 5, 5, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
      break;
    case 'soft':
      setEyes('#ffaa66', 3.5, 3.5, 0.7);
      break;
    default:
      setEyes('url(#eyeGlow)', 3.5, 4, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
}

window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  getState: function() { return currentState; }
};

setInterval(function() {
  idleMinutes++;
  if (idleMinutes >= 30) setExpression('sleepy');
}, 60000);

setExpression('idle');
decayHeat();
</script>
</body>
</html>
