<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: visible; width: 100px; height: 150px; display: flex; align-items: center; justify-content: center; font-family: sans-serif; position: relative; }

#pet { position: relative; width: 75px; height: 100px; transition: transform 0.3s ease; overflow: visible; }

#heatOverlay { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; transition: background 0.8s ease; }

#bubble { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); padding: 2px 7px; border-radius: 8px; font-size: 9px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; }
#bubble.show { opacity: 1; }
#bubble.default { background: #333; color: #eee; }
#bubble.angry { background: #4a1010; color: #ff6666; }
#bubble.soft { background: #3a3a50; color: #ddccff; }
#bubble.warm { background: #4a3020; color: #ffcc88; }
#bubble.cold { background: #1a2a3a; color: #88ccff; }

#zzz { position: absolute; top: 4px; right: 12px; font-size: 10px; color: #88aacc; opacity: 0; transition: opacity 0.4s; }
#zzz.show { opacity: 0.8; }

.bounce { animation: bounce 0.4s ease; }
.flinch { animation: flinch 0.3s ease; }
.wiggle { animation: wiggle 0.6s ease; }
.nod { animation: nod 0.6s ease; }
.sleep { animation: breathe 3s ease-in-out infinite; }
.wake { animation: stretch 0.8s ease-out; }
.tilt-right { transform: rotate(8deg); }
.tilt-left { transform: rotate(-8deg); }
.tilt-tiny-right { transform: rotate(4deg); }
.tilt-tiny-left { transform: rotate(-4deg); }
.sit { transform: translateY(5px); }
.carry { animation: carry 1.2s ease-in-out infinite; }
.drowsy { animation: drowsy 2s ease-in-out infinite; }
.peek { animation: peek 1.5s ease-in-out infinite; }
.bubble { animation: bubble 1.8s ease-in-out infinite; }

@keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } 60% { transform: translateY(-3px); } }
@keyframes flinch { 0% { transform: scale(1); } 30% { transform: scale(0.85, 1.15); } 60% { transform: scale(1.05, 0.95); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
@keyframes nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1, 0.96); } }

@keyframes float-up { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.5; } 100% { transform: translateY(-10px); opacity: 0; } }
@keyframes stretch { 0% { transform: scale(0.9, 1.1); } 30% { transform: scale(1.08, 0.92); } 60% { transform: scale(0.97, 1.03); } 100% { transform: scale(1, 1); } }
@keyframes carry { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
@keyframes drowsy { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(1px) rotate(-2deg); } 70% { transform: translateY(-1px) rotate(1deg); } }
@keyframes peek { 0%,100% { transform: translateY(0); } 15% { transform: translateY(-3px); } 30% { transform: translateY(0); } 45% { transform: translateY(-2px); } 60% { transform: translateY(0); } }
@keyframes bubble { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

.note-float { animation: float-up 1.6s ease-out forwards; }

.eye-glow { transition: all 0.3s ease; }
</style>
</head>
<body>
<div id="bubble" class="bubble"></div>
<div id="pet">
  <div id="heatOverlay"></div>
  <div id="zzz">Zzz</div>

  <svg viewBox="0 0 120 160" width="75" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdd44"/>

      <radialGradient id="skullGrad" cx="50%" cy="40%" r="50%">

    <path d="M70 150 L68 156 L74 156 L72 150" fill="#585864" stroke="none"/>

    <!-- Legs -->

    <rect x="66" y="136" width="8" height="16" rx="3" fill="#3a3a44"/>

    <!-- Body -->
    <path id="body" d="M44 84 Q42 100 40 112 Q38 124 40 134 Q42 138 46 140 L74 140 Q78 138 80 134 Q82 124 80 112 Q78 100 76 84 Z" fill="#4e4e5c" stroke="#5e5e6e" stroke-width="0.3"/>

    <!-- Vest -->
    <path id="vest" d="M44 84 Q42 96 42 108 Q42 120 44 128 Q46 132 48 134 L72 134 Q74 132 76 128 Q78 120 78 108 Q78 96 76 84 Z" fill="#2a3040" stroke="#3a4050" stroke-width="0.5"/>

    <!-- Vest seam lines -->

    <line id="vestSeamR" x1="72" y1="86" x2="72" y2="130" stroke="#3a4050" stroke-width="0.3" stroke-dasharray="2,2"/>

    <!-- Vest pockets -->
    <g id="vestPockets">

      <rect x="64" y="108" width="6" height="8" rx="1.5" fill="#242a38" stroke="#3a4050" stroke-width="0.3"/>

    <!-- Hoodie hood -->
    <path id="hood" d="M34 60 Q30 32 36 22 Q42 14 60 12 Q78 14 84 22 Q90 32 86 60 Q88 76 86 80 Q84 84 80 84 L40 84 Q36 84 34 80 Q32 76 34 60 Z" fill="none" stroke="none" stroke-width="0"/>

    <!-- Headphones on head (music) -->

    <rect id="hpCupL" x="27" y="24" width="9" height="15" rx="4" fill="#1a1a1a" display="none"/>
    <rect id="hpCupLInner" x="30" y="27" width="3" height="9" rx="1.5" fill="#cc3333" display="none"/>
    <rect id="hpCupR" x="84" y="24" width="9" height="15" rx="4" fill="#1a1a1a" display="none"/>
    <rect id="hpCupRInner" x="87" y="27" width="3" height="9" rx="1.5" fill="#cc3333" display="none"/>

    <!-- Headphones around neck (work) -->
    <path id="neckArc" d="M36 54 Q34 44 60 42 Q86 44 84 54" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" display="none"/>
    <rect id="neckCupL" x="30" y="50" width="8" height="13" rx="3.5" fill="#1a1a1a" display="none"/>

    <!-- Glasses (read) -->
    <rect id="glsL" x="42" y="44" width="13" height="9" rx="3" fill="none" stroke="#4a4a4a" stroke-width="1" display="none"/>
    <rect id="glsR" x="65" y="44" width="13" height="9" rx="3" fill="none" stroke="#4a4a4a" stroke-width="1" display="none"/>
    <line id="glsBridge" x1="55" y1="48" x2="65" y2="48" stroke="#4a4a4a" stroke-width="0.8" display="none"/>
    <line id="glsArmL" x1="42" y1="47" x2="35" y2="46" stroke="#4a4a4a" stroke-width="0.7" display="none"/>
    <line id="glsArmR" x1="78" y1="47" x2="85" y2="46" stroke="#4a4a4a" stroke-width="0.7" display="none"/>

    <!-- Sunglasses (chill) -->
    <rect id="sunL" x="42" y="44" width="13" height="9" rx="3" fill="#1a1a22" stroke="#333" stroke-width="0.8" display="none"/>
    <rect id="sunR" x="65" y="44" width="13" height="9" rx="3" fill="#1a1a22" stroke="#333" stroke-width="0.8" display="none"/>
    <line id="sunBridge" x1="55" y1="48" x2="65" y2="48" stroke="#333" stroke-width="0.8" display="none"/>

    <!-- Music notes -->
    <g id="musicNotes" display="none">
      <text class="mnote" x="86" y="18" font-size="10" fill="#ffcc00" opacity="0">J</text>
      <text class="mnote" x="96" y="10" font-size="7" fill="#ff8844" opacity="0">K</text>
      <text class="mnote" x="90" y="32" font-size="6" fill="#ffcc00" opacity="0">J</text>
    </g>

    <!-- Tool (work) -->
    <rect id="toolHandle" x="86" y="108" width="3" height="16" rx="1" fill="#8a7a6a" display="none"/>

    <!-- Left arm -->
    <path id="armL" d="M44 86 Q34 88 30 96 Q28 104 30 112 Q30 116 34 118 L38 118 Q42 118 44 114" fill="#4e4e5c" stroke="#5e5e6e" stroke-width="0.3"/>
    <path d="M30 96 Q28 98 30 100" fill="none" stroke="#5e5e6e" stroke-width="0.4"/>

    <!-- Left hand -->
    <path id="handL" d="M30 112 Q24 114 22 118 Q20 122 24 124 Q26 124 28 122 L30 124 Q32 126 34 124 Q36 126 38 122 Q40 120 38 118 Q36 116 34 114 Z" fill="#4e4e5c" stroke="#5e5e6e" stroke-width="0.3"/>
    <rect x="24" y="120" width="10" height="2" rx="1" fill="#3e3e4c"/>

    <!-- Right arm -->
    <path id="armR" d="M76 86 Q86 88 90 96 Q92 104 90 112 Q90 116 86 118 L82 118 Q78 118 76 114" fill="#4e4e5c" stroke="#5e5e6e" stroke-width="0.3"/>
    <path d="M90 96 Q92 98 90 100" fill="none" stroke="#5e5e6e" stroke-width="0.4"/>

    <!-- Right hand -->
    <path id="handR" d="M90 112 Q96 114 98 118 Q100 122 96 124 Q94 124 92 122 L90 124 Q88 126 86 124 Q84 126 82 122 Q80 120 82 118 Q84 116 86 114 Z" fill="#4e4e5c" stroke="#5e5e6e" stroke-width="0.3"/>
    <rect x="86" y="120" width="10" height="2" rx="1" fill="#3e3e4c"/>

    <!-- Head: balaclava -->
    <path id="head" d="M34 60 Q32 28 60 18 Q88 28 86 60 Q88 78 86 82 Q84 86 80 86 L40 86 Q36 86 34 82 Q32 78 34 60 Z" fill="#3e3e4c" stroke="#4e4e5e" stroke-width="0.4"/>

    <!-- Balaclava folds -->
    <path d="M38 42 Q36 44 36 48" fill="none" stroke="#4e4e5e" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M82 42 Q84 44 84 48" fill="none" stroke="#4e4e5e" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M36 56 Q38 58 36 62" fill="none" stroke="#4e4e5e" stroke-width="0.3" stroke-linecap="round"/>
    <path d="M84 56 Q82 58 84 62" fill="none" stroke="#4e4e5e" stroke-width="0.3" stroke-linecap="round"/>

    <!-- Skull mask -->
    <path id="skull" d="M44 48 Q42 38 46 32 Q50 26 56 24 Q60 23 64 24 Q70 26 74 32 Q78 38 76 48 L76 56 Q78 64 74 68 Q72 72 68 76 Q64 78 60 78 Q58 78 56 76 Q52 72 50 68 Q46 64 48 60 Q44 56 44 52 Z" fill="url(#skullGrad)" stroke="#c4b8a8" stroke-width="0.5"/>
    <path d="M48 38 Q54 36 60 36" fill="none" stroke="#e0d6c8" stroke-width="0.3"/>
    <path d="M60 36 Q66 36 72 38" fill="none" stroke="#e0d6c8" stroke-width="0.3"/>

    <!-- Eye sockets -->
    <path id="eyeL" d="M46 50 Q48 44 53 42 Q56 42 58 46 Q60 50 58 54 Q56 58 53 58 Q48 58 46 54 Z" fill="#080808"/>
    <path id="eyeR" d="M62 46 Q64 42 67 42 Q70 44 72 50 Q74 54 72 58 Q68 58 64 54 Q62 50 62 46 Z" fill="#080808"/>

    <!-- Glowing pupils -->
    <ellipse class="eye-glow eye-pupil" id="eyeLeft" cx="53" cy="50" rx="3.5" ry="4" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>
    <ellipse class="eye-glow eye-pupil" id="eyeRight" cx="67" cy="50" rx="3.5" ry="4" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>

    <!-- Eye sparkle -->
    <ellipse id="sparkL" cx="50.5" cy="48" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>
    <ellipse id="sparkR" cx="64.5" cy="48" rx="1.4" ry="1.4" fill="#fff" opacity="0.85"/>

    <path d="M64 42 Q70 44 74 48" fill="none" stroke="#d0c6b8" stroke-width="0.3" stroke-linecap="round"/>

    <!-- Nose cavity -->
    <path d="M58 62 Q58 58 60 57 Q62 58 62 62 Q62 66 60 68 Q58 66 58 62 Z" fill="#1a1a18"/>

    <!-- Jaw -->
    <path d="M46 62 Q48 66 52 68" fill="none" stroke="#c4b8a8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M54 68 Q56 70 58 72" fill="none" stroke="#c4b8a8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M62 72 Q64 70 66 68" fill="none" stroke="#c4b8a8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M68 68 Q72 66 74 62" fill="none" stroke="#c4b8a8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M60 70 L60 78" fill="none" stroke="#c4b8a8" stroke-width="0.5" stroke-linecap="round"/>

    <!-- Teeth -->
    <line x1="50" y1="66" x2="50" y2="70" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="54" y1="68" x2="54" y2="72" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="58" y1="70" x2="58" y2="74" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="62" y1="70" x2="62" y2="74" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="66" y1="68" x2="66" y2="72" stroke="#ccc0b0" stroke-width="0.4"/>
    <line x1="70" y1="66" x2="70" y2="70" stroke="#ccc0b0" stroke-width="0.4"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const sparkL = document.getElementById('sparkL');
const sparkR = document.getElementById('sparkR');

let currentState = 'idle';
let currentOutfit = 'default';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowFill, glowRx, glowRy, glowOpacity) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowFill || 'url(#eyeGlow)');
    e.setAttribute('rx', glowRx != null ? glowRx : 3.5);
    e.setAttribute('ry', glowRy != null ? glowRy : 4);
    e.setAttribute('opacity', glowOpacity != null ? glowOpacity : '1');
  });
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}

var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  var duration = name === 'sleep' ? 3000 : (name === 'wiggle' || name === 'nod' ? 600 : 400);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, duration);
}

function setExpression(expr) {
  var animClasses = ['sleep', 'wake', 'carry', 'drowsy', 'peek', 'bubble', 'tilt-right', 'tilt-left', 'tilt-tiny-right', 'tilt-tiny-left', 'sit'];
  animClasses.forEach(function(c) { pet.classList.remove(c); });
  zzz.classList.remove('show');

  switch (expr) {
    case 'happy':
      setEyes('#ffcc00', 3, 4.5, 1);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 2.5, 3, 1);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 3, 4.5, 1);
      playAnimation('flinch');
      break;
    case 'sleep':
      setEyes('#664400', 1.5, 1.5, 0.4);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'wake':
      setEyes('#ffaa66', 3.5, 3.5, 0.7);
      pet.classList.add('wake');
      setTimeout(function() { pet.classList.remove('wake'); }, 800);
      break;
    case 'peek':
      setEyes('#ffcc44', 4, 4, 0.8);
      pet.classList.add('peek');
      break;
    case 'bubble':
      setEyes('#88aacc', 3, 3, 0.6);
      pet.classList.add('bubble');
      break;
    case 'carry':
      setEyes('#ffaa66', 3, 3.5, 0.7);
      pet.classList.add('carry');
      break;
    case 'drowsy':
      setEyes('#664400', 1.5, 1.5, 0.5);
      pet.classList.add('drowsy');
      break;
    case 'shocked':
      setEyes('#ffee00', 5.5, 5.5, 1);
      playAnimation('flinch');
      break;
    case 'sad':
      setEyes('#6688aa', 2.5, 3, 0.6);
      pet.classList.add('tilt-tiny-left');
      setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 1500);
      break;
    case 'alert':
      setEyes('#ff4400', 5, 5, 1);
      break;
    case 'soft':
      setEyes('#ffaa66', 3.5, 3.5, 0.7);
      break;
    case 'curious':
      setEyes('#ffcc44', 4.5, 4.5, 1);
      pet.classList.add('tilt-tiny-right');
      setTimeout(function() { pet.classList.remove('tilt-tiny-right'); }, 1500);
      break;
    case 'smug':
      setEyes('#ffaa00', 2, 3.5, 1);
      pet.classList.add('tilt-tiny-left');
      setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 1500);
      break;
    case 'deadpan':
      setEyes('#ff8800', 3, 2, 0.9);
      break;
    case 'surprised':
      setEyes('#ffee00', 5.5, 5.5, 1);
      playAnimation('flinch');
      break;
    case 'normal':
    case 'idle':
    default:
      setEyes('url(#eyeGlow)', 3.5, 4, 1);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
  idleMinutes = 0;
}

function showById(id, show) {
  var el = document.getElementById(id);
  if (el) el.setAttribute('display', show ? '' : 'none');
}

function setOutfit(name) {
  var body = document.getElementById('body');
  var vest = document.getElementById('vest');
  var vestPockets = document.getElementById('vestPockets');
  var vestSeamL = document.getElementById('vestSeamL');
  var vestSeamR = document.getElementById('vestSeamR');
  var vestZip = document.getElementById('vestZip');
  var vestCollar = document.getElementById('vestCollar');
  var armL = document.getElementById('armL');
  var armR = document.getElementById('armR');
  var handL = document.getElementById('handL');
  var handR = document.getElementById('handR');
  var hood = document.getElementById('hood');

  ['hardhat','hardhatRim','hardhatRidge','hpArc','hpCupL','hpCupLInner','hpCupR','hpCupRInner',
   'neckArc','neckCupL','neckCupR','glsL','glsR','glsBridge','glsArmL','glsArmR',
   'sunL','sunR','sunBridge','musicNotes','toolHandle','toolHead'].forEach(function(id) { showById(id, false); });

  switch (name) {
    case 'default':
      body.setAttribute('fill', '#4e4e5c');
      vest.setAttribute('fill', '#2a3040');
      vest.setAttribute('stroke', '#3a4050');
      vestPockets.style.display = '';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#4e4e5c');
      armR.setAttribute('fill', '#4e4e5c');
      handL.setAttribute('fill', '#4e4e5c');
      handR.setAttribute('fill', '#4e4e5c');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      break;
    case 'stealth':
      body.setAttribute('fill', '#1a1a24');
      vest.setAttribute('fill', '#1a1a24');
      vest.setAttribute('stroke', '#252530');
      vestPockets.style.display = 'none';
      vestSeamL.style.display = 'none';
      vestSeamR.style.display = 'none';
      vestZip.style.display = 'none';
      vestCollar.style.display = 'none';
      armL.setAttribute('fill', '#1a1a24');
      armR.setAttribute('fill', '#1a1a24');
      handL.setAttribute('fill', '#1a1a24');
      handR.setAttribute('fill', '#1a1a24');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      break;
    case 'hoodie':
      body.setAttribute('fill', '#3a3a48');
      vest.setAttribute('fill', '#3a3a48');
      vest.setAttribute('stroke', '#4a4a5a');
      vestPockets.style.display = 'none';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#3a3a48');
      armR.setAttribute('fill', '#3a3a48');
      handL.setAttribute('fill', '#3a3a48');
      handR.setAttribute('fill', '#3a3a48');
      hood.setAttribute('fill', '#3a3a48');
      hood.setAttribute('stroke', '#4a4a5a');
      hood.setAttribute('stroke-width', '0.4');
      break;
    case 'formal':
      body.setAttribute('fill', '#3a3a46');
      vest.setAttribute('fill', '#1e1e2c');
      vest.setAttribute('stroke', '#2e2e3e');
      vestPockets.style.display = '';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#3a3a46');
      armR.setAttribute('fill', '#3a3a46');
      handL.setAttribute('fill', '#3a3a46');
      handR.setAttribute('fill', '#3a3a46');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      break;
    case 'work':
      body.setAttribute('fill', '#4e4e5c');
      vest.setAttribute('fill', '#3a3430');
      vest.setAttribute('stroke', '#4a4440');
      vestPockets.style.display = '';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#4e4e5c');
      armR.setAttribute('fill', '#4e4e5c');
      handL.setAttribute('fill', '#4e4e5c');
      handR.setAttribute('fill', '#4e4e5c');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      showById('hardhat', true);
      showById('hardhatRim', true);
      showById('hardhatRidge', true);
      showById('neckArc', true);
      showById('neckCupL', true);
      showById('neckCupR', true);
      showById('toolHandle', true);
      showById('toolHead', true);
      break;
    case 'music':
      body.setAttribute('fill', '#3a3a48');
      vest.setAttribute('fill', '#2a2a38');
      vest.setAttribute('stroke', '#3a3a48');
      vestPockets.style.display = 'none';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#3a3a48');
      armR.setAttribute('fill', '#3a3a48');
      handL.setAttribute('fill', '#3a3a48');
      handR.setAttribute('fill', '#3a3a48');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      showById('hpArc', true);
      showById('hpCupL', true);
      showById('hpCupLInner', true);
      showById('hpCupR', true);
      showById('hpCupRInner', true);
      showById('musicNotes', true);
      setTimeout(animateMusicNotes, 200);
      break;
    case 'chill':
      body.setAttribute('fill', '#5a5a66');
      vest.setAttribute('fill', '#3e3e4c');
      vest.setAttribute('stroke', '#4e4e5c');
      vestPockets.style.display = '';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#5a5a66');
      armR.setAttribute('fill', '#5a5a66');
      handL.setAttribute('fill', '#5a5a66');
      handR.setAttribute('fill', '#5a5a66');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      showById('sunL', true);
      showById('sunR', true);
      showById('sunBridge', true);
      break;
    case 'read':
      body.setAttribute('fill', '#4a4a52');
      vest.setAttribute('fill', '#3a3a40');
      vest.setAttribute('stroke', '#4a4a50');
      vestPockets.style.display = '';
      vestSeamL.style.display = '';
      vestSeamR.style.display = '';
      vestZip.style.display = '';
      vestCollar.style.display = '';
      armL.setAttribute('fill', '#4a4a52');
      armR.setAttribute('fill', '#4a4a52');
      handL.setAttribute('fill', '#4a4a52');
      handR.setAttribute('fill', '#4a4a52');
      hood.setAttribute('fill', 'none');
      hood.setAttribute('stroke', 'none');
      showById('glsL', true);
      showById('glsR', true);
      showById('glsBridge', true);
      showById('glsArmL', true);
      showById('glsArmR', true);
      break;
  }
  currentOutfit = name;
}

function animateMusicNotes() {
  var notes = document.querySelectorAll('.mnote');
  notes.forEach(function(note, i) {
    note.style.opacity = '0';
    note.classList.remove('note-float');
    setTimeout(function() {
      note.style.opacity = '0.8';
      note.classList.add('note-float');
    }, i * 300);
  });
}

var idleTimer = null;
function scheduleIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  var delay = 8000 + Math.random() * 15000;
  idleTimer = setTimeout(doIdleAction, delay);
}
function doIdleAction() {
  if (currentState === 'sleep') { scheduleIdle(); return; }
  var r = Math.random();
  if (r < 0.18) {
    playAnimation('tilt-tiny-left');
    setTimeout(function() { pet.classList.remove('tilt-tiny-left'); }, 800);
  } else if (r < 0.32) {
    playAnimation('tilt-tiny-right');
    setTimeout(function() { pet.classList.remove('tilt-tiny-right'); }, 800);
  } else if (r < 0.44) {
    playAnimation('wiggle');
  } else if (r < 0.52) {
    playAnimation('nod');
  } else if (r < 0.62 && currentOutfit === 'music') {
    playAnimation('bounce');
    setTimeout(animateMusicNotes, 100);
  } else if (r < 0.68 && currentOutfit === 'chill') {
    pet.classList.add('sit');
    setTimeout(function() { pet.classList.remove('sit'); }, 2000);
  } else {
    var talks = ['嗯', '在呢', '盯着呢', '说', '什么', '想', '看', '等', '好', '知道了', '你忙你的', '呆着', '啧', '这', '行', '别慌', '慌什么', '稳', '不急', '没事', '继续', '看着呢', '随你', '嗯哼', '嗯哼？', '所以呢', '然后呢', '发呆', '走神了', '你也是', '话多', '话少', '安静点也好', '还行', '挺能熬', '不困', '我在这', '没走', '想什么呢', '不累', '你管我', '管好你自己', '嗯……', '还行吧', '凑合', '不错', '挺好', '再来', '接着来', '说啊', '听着呢', '等你呢', '玩够了？', '继续折腾', '不嫌累', '你挺有意思', '有意思', '没意思', '换一个', '再换', '算了', '不说了', '懒得说', '你真行', '你厉害', '服了', '认了', '随便你', '爱咋咋', '你说了算', '真拿你没办法', '习惯了', '就这', '还行吧你', '凑合看', '继续', '别停', '你说', '我听', '正听着', '在听', '耳朵在', '眼睛在', '都在'];
    var pick = talks[Math.floor(Math.random() * talks.length)];
    showBubble(pick, 'soft', 3500);
  }
  scheduleIdle();
}

var blinkTimer = null;
function scheduleBlink() {
  if (blinkTimer) clearTimeout(blinkTimer);
  var delay = 2000 + Math.random() * 4000;
  blinkTimer = setTimeout(doBlink, delay);
}
function doBlink() {
  if (currentState === 'sleep') { scheduleBlink(); return; }
  [eyeLeft, eyeRight, sparkL, sparkR].forEach(function(e) { e.setAttribute('opacity', '0.1'); });
  setTimeout(function() {
    [eyeLeft, eyeRight, sparkL, sparkR].forEach(function(e) { e.setAttribute('opacity', '1'); });
    sparkL.setAttribute('opacity', '0.85');
    sparkR.setAttribute('opacity', '0.85');
  }, 120);
  scheduleBlink();
}

window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  setOutfit: function(name) { setOutfit(name); },
  getState: function() { return currentState; },
  getOutfit: function() { return currentOutfit; }
};

setExpression('idle');
scheduleIdle();
scheduleBlink();
</script>
