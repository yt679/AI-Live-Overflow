<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pet {
    width: 160px;
    height: 200px;
    transition: transform 0.3s ease;
  }
  .pet.tilt-left  { transform: rotate(-5deg); }
  .pet.tilt-right { transform: rotate(5deg); }
  .pet.bounce     { animation: bounce 0.4s ease; }
  .pet.flinch     { animation: flinch 0.3s ease; }
  .pet.sleep      { animation: breathe 3s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-14px); }
    60% { transform: translateY(-5px); }
  }
  @keyframes flinch {
    0% { transform: scale(1); }
    30% { transform: scale(0.88); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.95); }
  }
  @keyframes eyeBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
  .bubble {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 200px;
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: center;
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
  .bubble.default { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
  .bubble.angry   { background: #3a1a1a; color: #f88; border: 1px solid #622; }
  .bubble.soft    { background: #1a1a2a; color: #aac; border: 1px solid #335; }
  .bubble.warm    { background: #2a1a1a; color: #faa; border: 1px solid #533; }
  .heat-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: transparent;
    transition: background 0.8s ease;
  }
  .zzz {
    position: absolute;
    top: 5px;
    right: 15px;
    font-size: 15px;
    color: #8899cc;
    opacity: 0;
    transition: opacity 0.5s ease;
    font-family: sans-serif;
  }
  .zzz.show { opacity: 1; }
  .eye-glow { transition: all 0.3s ease; }
</style>
</head>
<body>
<div class="heat-overlay" id="heatOverlay"></div>
<div class="container">
  <div class="bubble default" id="bubble"></div>
  <div class="zzz" id="zzz">Zzz</div>
  <svg class="pet" id="pet" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGrad" cx="50%" cy="25%" r="65%">
        <stop offset="0%" stop-color="#3a3a44"/>
        <stop offset="100%" stop-color="#1a1a22"/>
      </radialGradient>
      <radialGradient id="skullGrad" cx="50%" cy="30%" r="55%">
        <stop offset="0%" stop-color="#faf6f0"/>
        <stop offset="100%" stop-color="#d8cfc4"/>
      </radialGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdd66"/>
        <stop offset="35%" stop-color="#ff9900"/>
        <stop offset="100%" stop-color="#cc4400"/>
      </radialGradient>
      <radialGradient id="cheekFlush" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff8888" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#ff8888" stop-opacity="0"/>
      </radialGradient>
      <filter id="softShadow" x="-30%" y="-10%" width="160%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
      </filter>
      <filter id="eyeFilter" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Ground shadow -->
    <ellipse cx="80" cy="185" rx="38" ry="6" fill="rgba(0,0,0,0.2)"/>

    <!-- Body: classic round ghost blob with wavy bottom -->
    <g filter="url(#softShadow)">
      <path d="M38 90 Q32 45 80 36 Q128 45 122 90 L124 150 Q122 170 110 168 Q102 156 94 168 Q86 176 80 168 Q74 176 66 168 Q58 156 50 168 Q38 170 38 150 Z"
        fill="url(#bodyGrad)"/>
    </g>

    <!-- Two tiny cute arms/hands -->
    <ellipse cx="40" cy="105" rx="10" ry="7" fill="#2a2a32" transform="rotate(-15 40 105)"/>
    <ellipse cx="120" cy="105" rx="10" ry="7" fill="#2a2a32" transform="rotate(15 120 105)"/>

    <!-- Skull mask: round, cute proportions -->
    <g id="skullMask">
      <!-- Mask base: wide, round, cute skull -->
      <rect x="48" y="42" width="64" height="56" rx="18" ry="16"
        fill="url(#skullGrad)" stroke="#c4b8a8" stroke-width="0.7"/>

      <!-- Cheekbone contours: soft curves -->
      <path d="M48 64 Q44 62 44 56 Q44 48 50 44" fill="none" stroke="#ccc0b0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M112 64 Q116 62 116 56 Q116 48 110 44" fill="none" stroke="#ccc0b0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Eye sockets: large, round, cute -->
      <ellipse id="eyeL" cx="66" cy="64" rx="10" ry="11" fill="#161616"/>
      <ellipse id="eyeR" cx="94" cy="64" rx="10" ry="11" fill="#161616"/>

      <!-- Glowing amber pupils: the key feature -->
      <ellipse class="eye-glow" id="eyeLeft" cx="66" cy="64" rx="5" ry="5.5"
        fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>
      <ellipse class="eye-glow" id="eyeRight" cx="94" cy="64" rx="5" ry="5.5"
        fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="1"/>

      <!-- Eye highlights: white sparkle dots -->
      <ellipse cx="63" cy="62" rx="2" ry="2" fill="#fff" opacity="0.8"/>
      <ellipse cx="91" cy="62" rx="2" ry="2" fill="#fff" opacity="0.8"/>

      <!-- Nose: tiny triangle -->
      <path d="M78 78 L80 81 L82 78 Z" fill="#1a1a18"/>

      <!-- Mouth: simple curved line -->
      <path d="M56 86 Q64 92 80 90 Q96 92 104 86" fill="none" stroke="#b8a898" stroke-width="1" stroke-linecap="round"/>

      <!-- Jaw crack: subtle, cute -->
      <line x1="80" y1="90" x2="80" y2="97" stroke="#c4b8a8" stroke-width="0.6" stroke-linecap="round"/>

      <!-- Teeth: small vertical lines at bottom -->
      <line x1="64" y1="86" x2="64" y2="90" stroke="#ccc0b0" stroke-width="0.5"/>
      <line x1="72" y1="88" x2="72" y2="92" stroke="#ccc0b0" stroke-width="0.5"/>
      <line x1="88" y1="88" x2="88" y2="92" stroke="#ccc0b0" stroke-width="0.5"/>
      <line x1="96" y1="86" x2="96" y2="90" stroke="#ccc0b0" stroke-width="0.5"/>
    </g>

    <!-- Cheek blush: hidden by default, shows on happy/flustered -->
    <ellipse class="blush" id="blushLeft" cx="54" cy="78" rx="8" ry="5" fill="url(#cheekFlush)" opacity="0"/>
    <ellipse class="blush" id="blushRight" cx="106" cy="78" rx="8" ry="5" fill="url(#cheekFlush)" opacity="0"/>
  </svg>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const zzz = document.getElementById('zzz');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const blushLeft = document.getElementById('blushLeft');
const blushRight = document.getElementById('blushRight');

let currentState = 'idle';
let heat = 0;
let idleMinutes = 0;
let bubbleTimer = null;

function showBubble(text, style, duration) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubble.textContent = text;
  bubble.className = 'bubble ' + (style || 'default') + ' show';
  if (duration) bubbleTimer = setTimeout(hideBubble, duration);
}
function hideBubble() { bubble.classList.remove('show'); }

function setEyes(glowFill, glowRx, glowRy, glowOpacity, coreFill) {
  [eyeLeft, eyeRight].forEach(function(e) {
    e.setAttribute('fill', glowFill || 'url(#eyeGlow)');
    e.setAttribute('rx', glowRx || 5);
    e.setAttribute('ry', glowRy || 5.5);
    e.setAttribute('opacity', glowOpacity != null ? glowOpacity : '1');
  });
}
function setBlush(show) {
  var op = show ? 0.5 : 0;
  blushLeft.setAttribute('opacity', op);
  blushRight.setAttribute('opacity', op);
}
function setHeat(value) {
  heat = Math.max(0, Math.min(100, value));
  heatOverlay.style.background = 'rgba(255, 40, 40, ' + (heat / 200) + ')';
}
function decayHeat() {
  if (heat > 0) { setHeat(heat - 1); setTimeout(decayHeat, 30000); }
}
var animating = false;
function playAnimation(name) {
  if (animating) return;
  animating = true;
  pet.classList.add(name);
  setTimeout(function() { pet.classList.remove(name); animating = false; }, name === 'sleep' ? 3000 : 400);
}

function setExpression(expr) {
  switch (expr) {
    case 'happy':
      setEyes('#ffcc00', 4, 5.5, 1); setBlush(true);
      pet.classList.add('tilt-right');
      setTimeout(function() { pet.classList.remove('tilt-right'); }, 1000);
      break;
    case 'angry':
      setEyes('#ff2200', 3.5, 4, 1); setBlush(false);
      pet.classList.add('tilt-left');
      setTimeout(function() { pet.classList.remove('tilt-left'); }, 1000);
      break;
    case 'flustered':
      setEyes('#ff8844', 4, 5.5, 1); setBlush(true);
      playAnimation('flinch');
      break;
    case 'sleepy':
      setEyes('#664400', 2, 2, 0.5); setBlush(false);
      zzz.classList.add('show');
      pet.classList.add('sleep');
      break;
    case 'alert':
      setEyes('#ff4400', 6.5, 6.5, 1); setBlush(false);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
      break;
    case 'soft':
      setEyes('#ffaa66', 5, 5, 0.8); setBlush(true);
      break;
    default:
      setEyes('url(#eyeGlow)', 5, 5.5, 1); setBlush(false);
      zzz.classList.remove('show');
      pet.classList.remove('sleep');
  }
  currentState = expr;
}

window.petEngine = {
  onTap: function() {
    idleMinutes = 0;
    playAnimation('bounce');
    setExpression('alert');
    setTimeout(function() { setExpression('idle'); }, 2000);
  },
  onDoubleTap: function() {
    idleMinutes = 0;
    playAnimation('flinch');
    setExpression('flustered');
    setTimeout(function() { setExpression('idle'); }, 2500);
  },
  onLongPress: function() {
    idleMinutes = 0;
    setExpression('angry');
    setTimeout(function() { setExpression('idle'); }, 3000);
  },
  say: function(text, style) {
    showBubble(text, style || 'default', 4000);
  },
  setExpression: function(expr) { setExpression(expr); },
  setHeat: function(value) { setHeat(value); },
  getState: function() { return currentState; }
};

setInterval(function() {
  idleMinutes++;
  if (idleMinutes >= 30) setExpression('sleepy');
}, 60000);

setExpression('idle');
decayHeat();
</script>
</body>
</html>
